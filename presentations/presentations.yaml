# Hand-maintained list of presentations, courses, and workshops, rendered
# by presentations.qmd via presentations-template.ejs.md (same list-item
# format as software/software-template.ejs.md). Entries render in the order
# they appear in this file (presentations.qmd sets sort: false) — reorder
# entries here to change the display order.
#
# Fields:
#   date         - YYYY-MM-01 (day is unused). For an ongoing/multi-year
#                  entry, use the start date here and set date_display below.
#   date_display - optional override for the displayed date, e.g.
#                  "2019 - Present" or "2022 - 2024", when a single
#                  month/year (derived from `date`) doesn't fit
#   role         - optional; e.g. "Instructor", "Teaching Assistant". Renders
#                  before the title as "Role, Title" (same formatting as
#                  when it was part of the title text)
#   title        - talk/poster/course/workshop title
#   venue        - conference / series / institution
#   type         - "Workshop" or "Presentation"
#   website_url  - optional link to a course/workshop site or materials
#   github_url   - optional link to a GitHub repo/org
#   slides_url   - optional link to slides
#   video_url    - optional link to a recording
#   paper_url    - optional link to an associated paper
#   misc         - optional; set to true to render the entry in the
#                  collapsible "Other Presentations" section at the bottom
#                  instead of the main list

